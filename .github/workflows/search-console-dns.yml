name: Add Search Console verification record
# เพิ่มระเบียน TXT ยืนยันความเป็นเจ้าของโดเมนให้บัญชี Search Console ของผู้ดูแลเว็บ
# Search Console ให้โดเมนเดียวมีเจ้าของได้หลายบัญชี ระเบียนยืนยันของเจ้าของร้านที่มีอยู่แล้วไม่ถูกแตะ
# เพิ่มอย่างเดียว ไม่แก้ ไม่ลบระเบียนใด ถ้ามีระเบียนนี้อยู่แล้วจะไม่เพิ่มซ้ำ
# รหัสยืนยันเป็นข้อมูลสาธารณะใน DNS อยู่แล้ว ไม่ใช่ความลับ
on:
  push:
    branches: [main]
    paths: [.github/workflows/search-console-dns.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    environment: natee-customer-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lines: ${{ steps.add.outputs.lines }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: xn--22cki0cqma4cdedf2ixczace9c1mmc1fh6g.com
      RECORD: google-site-verification=Dk7oaAxgK6pFl2SxgvkotjbAnr8VdowGQOhAiWGc0oQ
    steps:
      - name: Add the TXT record if it is not there yet
        id: add
        shell: bash
        run: |
          node --input-type=module -e '
          const api = (path, init = {}) => fetch("https://api.cloudflare.com/client/v4" + path, { ...init, headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN, "Content-Type": "application/json" } }).then((r) => r.json())
          const lines = []
          const zones = await api("/zones?name=" + process.env.DOMAIN)
          const zone = zones.result?.[0]
          lines.push("zone found = " + Boolean(zone) + (zones.success ? "" : " (" + (zones.errors?.[0]?.code || "") + ")"))
          if (zone) {
            const quoted = "\"" + process.env.RECORD + "\""
            const existing = await api("/zones/" + zone.id + "/dns_records?type=TXT&name=" + process.env.DOMAIN)
            const found = (existing.result || []).some((r) => r.content === process.env.RECORD || r.content === quoted)
            lines.push("can read DNS = " + Boolean(existing.success))
            if (found) lines.push("record = already there")
            else {
              const made = await api("/zones/" + zone.id + "/dns_records", { method: "POST", body: JSON.stringify({ type: "TXT", name: "@", content: quoted, ttl: 1, comment: "Google Search Console, web maintainer" }) })
              lines.push("record = " + (made.success ? "added" : "failed " + (made.errors?.[0]?.code || "") + " " + (made.errors?.[0]?.message || "")).slice(0, 90))
            }
          }
          (await import("node:fs")).appendFileSync(process.env.GITHUB_OUTPUT, "lines=" + JSON.stringify(lines) + "\n")
          console.log(lines.join("\n"))
          ' 2>&1 || true
          grep -q '^lines=' "$GITHUB_OUTPUT" || echo 'lines=["script error"]' >> "$GITHUB_OUTPUT"
  answers:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        answer: ${{ fromJSON(needs.record.outputs.lines) }}
    name: ${{ matrix.answer }}
    steps:
      - run: echo "${{ matrix.answer }}"
