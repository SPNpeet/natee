name: Diagnose Natee production data (read only)
# ตรวจสถานะข้อมูลบนบัญชีลูกค้าเมื่อผู้ใช้แจ้งว่าใช้หลังบ้านไม่ได้
# อ่านอย่างเดียว ไม่แก้ ไม่ลบ และไม่พิมพ์อีเมลหรือเนื้อหาลงที่สาธารณะ เพราะ repo เป็น public
# log ของ Actions ต้องล็อกอินจึงจะอ่านได้ ผลจึงถูกส่งออกมาเป็นชื่องานย่อย ซึ่งอ่านได้จากหน้ารายการงาน
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: natee-customer-preview
  cancel-in-progress: false
jobs:
  collect:
    environment: natee-customer-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lines: ${{ steps.report.outputs.lines }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c3a30b952642a567008635f095785ca
      SITE: https://xn--22cki0cqma4cdedf2ixczace9c1mmc1fh6g.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write read-only customer configuration
        shell: bash
        run: |
          cat > wrangler.customer.jsonc <<'CONFIG'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "natee",
            "main": "worker/index.mjs",
            "compatibility_date": "2026-09-09",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "natee",
                "database_id": "db70eea1-2f69-4222-b895-a47288bb155c",
                "migrations_dir": "worker/migrations"
              }
            ],
            "kv_namespaces": [
              {
                "binding": "MEDIA",
                "id": "b6e29331310d402e90aef580a03c16c7"
              }
            ],
            "vars": { "SITE_URL": "https://xn--22cki0cqma4cdedf2ixczace9c1mmc1fh6g.com" },
            "account_id": "3c3a30b952642a567008635f095785ca"
          }
          CONFIG
      - name: Count rows in every table
        run: |
          npx wrangler d1 execute natee --remote --config wrangler.customer.jsonc --json --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM users WHERE active=1) AS users_active, (SELECT COUNT(*) FROM content) AS content_rows, (SELECT IFNULL(MAX(version),0) FROM content) AS content_version, (SELECT IFNULL(LENGTH(data),0) FROM content WHERE id=1) AS content_bytes, (SELECT COUNT(*) FROM revisions) AS revisions, (SELECT COUNT(*) FROM media) AS media_files, (SELECT COUNT(*) FROM inquiries) AS inquiries, (SELECT COUNT(*) FROM sessions) AS sessions, (SELECT COUNT(*) FROM limits WHERE expires > CAST(strftime('%s','now') AS INTEGER)*1000) AS rate_limits_active" > counters.json
          node -e "const r=require('./counters.json');const row=(Array.isArray(r)?r:[r]).flatMap(x=>x.results||[])[0];require('fs').writeFileSync('counters.env',Object.entries(row).map(([k,v])=>k+'='+v).join('\n')+'\n')"
          cat counters.env >> "$GITHUB_ENV"
      - name: Compare the saved content with the defaults and with the live page
        run: |
          npm run build
          npx wrangler d1 execute natee --remote --config wrangler.customer.jsonc --json --command "SELECT data FROM content WHERE id=1" > saved.json
          node -e "const r=require('./saved.json');const row=(Array.isArray(r)?r:[r]).flatMap(x=>x.results||[])[0];require('fs').writeFileSync('saved-content.json',row?row.data:'{}')"
          node scripts/diagnose-content.mjs saved-content.json "$SITE"
          cat content-diff.env >> "$GITHUB_ENV"
      - name: Send one analytics ping to the live website and watch this database
        run: |
          read_count() {
            npx wrangler d1 execute natee --remote --config wrangler.customer.jsonc --json --command "SELECT IFNULL((SELECT count FROM daily_stats WHERE day=date('now') AND event='language_switch' AND place='other' AND language='en'),0) AS pings" > pings.json
            node -e "const r=require('./pings.json');console.log((Array.isArray(r)?r:[r]).flatMap(x=>x.results||[])[0].pings)"
          }
          before=$(read_count)
          curl --fail --silent --show-error -X POST "$SITE/api/events" -H "Origin: $SITE" -H 'Content-Type: application/json' --data '{"name":"language_switch","place":"diagnose-probe","language":"en"}'
          sleep 3
          after=$(read_count)
          echo "live_writes_here=$(test "$after" -gt "$before" && echo yes || echo no)" >> "$GITHUB_ENV"
      - name: Turn the answers into job names
        id: report
        run: |
          node -e "
          const keys=['users','users_active','content_rows','content_version','content_bytes','revisions','media_files','inquiries','sessions','rate_limits_active','saved_changes','shown_changes','dropped_by_upgrade','uploads_in_saved','live_vs_merged','live_writes_here'];
          const lines=keys.map(k=>k+' = '+(process.env[k]??'unknown'));
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'lines='+JSON.stringify(lines)+'\n');
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log(lines.join('\n'))"
      - name: Details for a signed in maintainer
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1
          npx wrangler d1 execute natee --remote --config wrangler.customer.jsonc --command "SELECT count, datetime(expires/1000,'unixepoch') AS expires_utc FROM limits ORDER BY expires DESC LIMIT 10"
          npx wrangler d1 execute natee --remote --config wrangler.customer.jsonc --command "SELECT id AS user_id, role, active, LENGTH(email) AS email_length, SUBSTR(password,1,20) AS hash_format FROM users ORDER BY id"
          npx wrangler d1 execute natee --remote --config wrangler.customer.jsonc --command "SELECT version, updated, LENGTH(data) AS bytes FROM revisions ORDER BY version DESC LIMIT 5"
          npx wrangler kv key list --namespace-id b6e29331310d402e90aef580a03c16c7 --remote | head -40
  answers:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        answer: ${{ fromJSON(needs.collect.outputs.lines) }}
    name: ${{ matrix.answer }}
    steps:
      - run: echo "${{ matrix.answer }}"
