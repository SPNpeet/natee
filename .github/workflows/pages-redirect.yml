name: Redirect the GitHub Pages copy to the production domain
# เว็บจริงอยู่ที่โดเมนของลูกค้าบน Cloudflare สำเนาบน GitHub Pages เหลือไว้แค่พาคนที่ใช้ลิงก์เก่าไปถูกที่
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/pages-redirect.yml", "scripts/pages-redirect.mjs", "scripts/site-config.mjs"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/pages-redirect.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
